<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Design two related wallpapers for the Samsung Galaxy Z Fold8 — one for the cover screen, one for the inner screen — and preview how they look as you fold and unfold." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>FoldWall Studio — Galaxy Z Fold8 wallpaper designer</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript><p style="padding:2rem;color:#ccc;font-family:system-ui">FoldWall Studio needs JavaScript to preview and edit wallpapers. Your images never leave your browser.</p></noscript>

    <!-- Plain scripts (no build step, works from a static host or straight from disk). Order matters. -->
    <script src="js/config.js"></script>
    <script src="js/geometry.js"></script>
    <script src="js/render.js"></script>
    <script src="js/images.js"></script>
    <script src="js/zip.js"></script>
    <script src="js/demo.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/store.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/components/GuideOverlay.js"></script>
    <script src="js/components/ScreenView.js"></script>
    <script src="js/components/PhoneModel.js"></script>
    <script src="js/components/ImageUploader.js"></script>
    <script src="js/components/ImageControls.js"></script>
    <script src="js/components/ScreenEditor.js"></script>
    <script src="js/components/DeviceInfo.js"></script>
    <script src="js/components/ViewModeSelector.js"></script>
    <script src="js/components/ExportPanel.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
